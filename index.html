<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KAI ANGEL X 9MICE | HEAVY METAL 2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass-bg: rgba(0, 0, 0, 0.2);
            --glass-border: rgba(255, 255, 255, 0.05);
            --glass-blur: blur(20px);
            --text-main: #fff;
            --text-sub: rgba(255, 255, 255, 0.5);
            --accent: #ff003c;
            --font-header: 'Anton', sans-serif;
            --font-mono: 'Space Mono', monospace;
            --ease-ios: cubic-bezier(0.32, 0.72, 0, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { display: none; }
        body { background-color: #000; color: var(--text-main); font-family: var(--font-mono); overflow: hidden; width: 100vw; height: 100vh; cursor: none; }

        /* КУРСОР */
        #cursor { width: 10px; height: 10px; background: #fff; border-radius: 50%; position: fixed; pointer-events: none; z-index: 9999; mix-blend-mode: difference; transition: transform 0.1s var(--ease-ios); transform: translate(-50%, -50%); }
        #cursor.hover { transform: translate(-50%, -50%) scale(4); background: var(--accent); }
        #cursor-follower { width: 30px; height: 30px; border: 1px solid rgba(255,255,255,0.3); border-radius: 50%; position: fixed; pointer-events: none; z-index: 9998; transition: transform 0.15s linear; transform: translate(-50%, -50%); }

        .viewport { width: 100%; height: 100%; position: relative; perspective: 2000px; overflow: hidden; }

        /* ФОН */
        .bg-manager { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; }
        .background-image { position: absolute; width: 110%; height: 110%; top: -5%; left: -5%; background-image: url('ava.png'); background-size: cover; background-position: center; filter: blur(50px) brightness(0.3); transition: transform 1s var(--ease-ios), filter 2s ease; }
        .overlay { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: radial-gradient(circle at center, rgba(0,0,0,0) 0%, rgba(0,0,0,0.9) 100%); }
        .noise { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%' height='100%' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"); opacity: 0.04; pointer-events: none; }

        /* СЕКЦИИ */
        .section { width: 100%; height: 100%; position: absolute; top: 0; left: 0; display: flex; flex-direction: column; align-items: center; transition: transform 1s var(--ease-ios), opacity 0.8s ease; will-change: transform, opacity; }
        #sec-hero { z-index: 10; justify-content: center; padding: 40px; transform-origin: center center -500px; }

        header { position: absolute; top: 0; width: 100%; padding: 30px 40px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        .logo { font-family: var(--font-header); font-size: 20px; letter-spacing: 1px; text-transform: uppercase; color: var(--accent); }

        /* ПЛЕЕР */
        .player-module { display: flex; align-items: center; gap: 10px; background: var(--glass-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border: 1px solid var(--glass-border); padding: 8px 15px; border-radius: 99px; }
        .mute-btn { width: 30px; height: 30px; display: flex; justify-content: center; align-items: center; border-radius: 50%; cursor: none; }
        .mute-btn svg { width: 18px; height: 18px; fill: #fff; opacity: 0.7; }
        .volume-slider { -webkit-appearance: none; appearance: none; width: 60px; height: 2px; background: rgba(255, 255, 255, 0.1); outline: none; }
        .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; background: #fff; border-radius: 50%; }

        /* ЦЕНТРАЛЬНЫЙ БЛОК */
        .central-wrapper { display: flex; flex-direction: column; align-items: center; transform-style: preserve-3d; }
        .glass-plate { position: relative; width: 350px; height: 350px; border-radius: 12px; padding: 8px; background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.01) 100%); border: 1px solid var(--glass-border); box-shadow: 0 50px 100px rgba(0,0,0,0.7); overflow: hidden; }
        .glass-plate img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }
        .content-info { text-align: center; margin-top: 40px; z-index: 10; }
        .title { font-family: var(--font-header); font-size: 56px; line-height: 1; text-transform: uppercase; letter-spacing: -2px; margin-bottom: 5px; animation: titlePulse 4s ease-in-out infinite; }
        @keyframes titlePulse { 0%, 100% { transform: scale(1); text-shadow: 0 0 0px rgba(255,0,60,0); } 50% { transform: scale(1.02); text-shadow: 2px 0 10px rgba(255,0,60,0.3); } }

        /* ТАЙМЕР ВНУТРИ ТРЕКЛИСТА */
        #sec-details { z-index: 5; background: #050505; transform: translateY(100%) scale(1.1); overflow-y: auto; padding: 80px 40px 0 40px; }
        .details-content { width: 100%; max-width: 1000px; display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 40px; margin: 0 auto; }
        .tracklist h2 { font-family: var(--font-header); font-size: 28px; text-transform: uppercase; margin-bottom: 25px; letter-spacing: 2px; }
        .track-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; transition: all 0.3s ease; }
        .track-item:hover { background: rgba(255,255,255,0.03); color: var(--accent); padding-left: 15px; }

        .countdown-wrapper { background: rgba(255,255,255,0.02); border: 1px solid var(--glass-border); border-radius: 12px; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; height: fit-content; position: sticky; top: 40px; }
        .timer { display: flex; gap: 15px; font-family: var(--font-header); font-size: 48px; }
        .timer-part { text-align: center; }
        .xx-val { display: block; animation: holoFlicker 2s infinite; }
        @keyframes holoFlicker { 0%, 100% { opacity: 1; transform: skew(0deg); } 5% { opacity: 0.7; transform: skew(2deg); filter: blur(1px); } }

        /* ЭФФЕКТ РАЗЛОМА (EVENT) */
        #event-shatter {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 2000; opacity: 0;
            background: url('https://i.imgur.com/vHdfyVv.png'); /* Прозрачные трещины */
            background-size: cover;
        }

        .cracking { animation: shake 0.2s infinite, flash 0.5s infinite; opacity: 1 !important; }
        @keyframes shake { 0% { transform: translate(0,0); } 25% { transform: translate(5px, -5px); } 50% { transform: translate(-5px, 5px); } 100% { transform: translate(0,0); } }
        @keyframes flash { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(3) contrast(2); } }

        /* ФИНАЛЬНЫЙ ЭКРАН (БУДУЩЕЕ) */
        #sec-future {
            z-index: 3000; background: #000; display: none; opacity: 0;
            justify-content: center; align-items: center; text-align: center;
        }
        .future-timer { font-family: var(--font-header); font-size: 12vw; color: #fff; line-height: 0.8; letter-spacing: -5px; }
        .future-label { font-size: 14px; letter-spacing: 10px; margin-top: 20px; color: var(--accent); opacity: 0.8; }

        @media (max-width: 768px) { .details-content { grid-template-columns: 1fr; } .title { font-size: 38px; } .future-timer { font-size: 20vw; } }
    </style>
</head>
<body>

    <div id="cursor"></div>
    <div id="cursor-follower"></div>

    <!-- АУДИО СИСТЕМА -->
    <audio id="bgm-intro" loop preload="auto"><source src="intro.mp3" type="audio/mpeg"></audio>
    <audio id="bgm-event" preload="auto"><source src="raz.mp3" type="audio/mpeg"></audio>
    <audio id="bgm-future" loop preload="auto"><source src="intro2.mp3" type="audio/mpeg"></audio>

    <div id="event-shatter"></div>

    <div class="viewport">
        <div class="bg-manager">
            <div class="background-image"></div>
            <div class="overlay"></div>
            <div class="noise"></div>
        </div>

        <!-- ГЛАВНЫЙ ЭКРАН -->
        <section class="section" id="sec-hero">
            <header>
                <div class="logo">HM2</div>
                <div class="player-module">
                    <div class="mute-btn hover-target" id="mute-btn">
                        <svg id="icon-on" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                        <svg id="icon-off" viewBox="0 0 24 24" style="display:none;"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
                    </div>
                    <input type="range" class="volume-slider hover-target" id="volume-slider" min="0" max="1" step="0.01" value="0.5">
                </div>
            </header>

            <div class="central-wrapper" id="tilt-container">
                <div class="glass-plate">
                    <img src="ava.png" alt="Cover">
                </div>
                <div class="content-info">
                    <h1 class="title hover-target">HEAVY METAL 2</h1>
                    <div class="soon">KAI ANGEL X 9MICE</div>
                    <div class="by-creator">by arter1ahall</div>
                </div>
            </div>
            <div class="scroll-hint">листай вниз</div>
        </section>

        <!-- ТРЕКЛИСТ И ПЕРВЫЙ ТАЙМЕР -->
        <section class="section" id="sec-details">
            <div class="details-content">
                <div class="tracklist">
                    <h2>TRACKLIST</h2>
                    <div class="track-container" id="track-list-items">
                        <!-- Треки остаются как были -->
                        <div class="track-item hover-target"><span class="track-num">01</span><span class="track-name">Cyber Is Dead Interlude</span></div>
                        <div class="track-item hover-target"><span class="track-num">02</span><span class="track-name">Fountainebleau</span></div>
                        <div class="track-item hover-target"><span class="track-num">03</span><span class="track-name">Phoenix</span></div>
                        <div class="track-item hover-target"><span class="track-num">04</span><span class="track-name">Blum (Big City Life)</span></div>
                        <div class="track-item hover-target"><span class="track-num">05</span><span class="track-name">Ринопластика (Surgery)</span></div>
                        <div class="track-item hover-target"><span class="track-num">06</span><span class="track-name">Paparazzi</span></div>
                    </div>
                </div>

                <div class="countdown-wrapper">
                    <div class="cd-title">До ивента:</div>
                    <div class="timer" id="main-timer">
                        <div class="timer-part"><span class="xx-val" id="d1">00</span><div class="timer-label">дней</div></div>
                        <div class="timer-part"><span class="xx-val" id="h1">00</span><div class="timer-label">час</div></div>
                        <div class="timer-part"><span class="xx-val" id="m1">00</span><div class="timer-label">мин</div></div>
                        <div class="timer-part"><span class="xx-val" id="s1">00</span><div class="timer-label">сек</div></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- ФИНАЛЬНЫЙ ИВЕНТ ЭКРАН -->
        <section class="section" id="sec-future">
            <div class="future-label">СЛЕДУЮЩАЯ ФАЗА</div>
            <div class="future-timer" id="final-timer">00:00:00:00</div>
            <div class="by-creator" style="margin-top:50px">HEAVY METAL 2 | FUTURE IS HERE</div>
        </section>
    </div>

    <script>
        // --- КОНСТАНТЫ ВРЕМЕНИ ---
        const EVENT_DATE = new Date("May 14, 2026 22:45:00 GMT+0300").getTime();
        const FUTURE_DATE = new Date("May 20, 2026 19:00:00 GMT+0300").getTime();

        const cursor = document.getElementById('cursor');
        const follower = document.getElementById('cursor-follower');
        const heroSection = document.getElementById('sec-hero');
        const detailsSection = document.getElementById('sec-details');
        const futureSection = document.getElementById('sec-future');
        const shatter = document.getElementById('event-shatter');
        
        const audioIntro = document.getElementById('bgm-intro');
        const audioEvent = document.getElementById('bgm-event');
        const audioFuture = document.getElementById('bgm-future');

        let eventStarted = false;

        // --- ЛОГИКА ТАЙМЕРОВ ---
        function updateTimers() {
            const now = new Date().getTime();

            // Таймер 1 (до ивента)
            if (!eventStarted) {
                const dist1 = EVENT_DATE - now;
                if (dist1 <= 0) {
                    startEvent();
                } else {
                    document.getElementById('d1').innerText = Math.floor(dist1 / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
                    document.getElementById('h1').innerText = Math.floor((dist1 % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
                    document.getElementById('m1').innerText = Math.floor((dist1 % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
                    document.getElementById('s1').innerText = Math.floor((dist1 % (1000 * 60)) / 1000).toString().padStart(2, '0');
                }
            }

            // Таймер 2 (после ивента)
            const dist2 = FUTURE_DATE - now;
            const d2 = Math.floor(dist2 / (1000 * 60 * 60 * 24));
            const h2 = Math.floor((dist2 % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m2 = Math.floor((dist2 % (1000 * 60 * 60)) / (1000 * 60));
            const s2 = Math.floor((dist2 % (1000 * 60)) / 1000);
            document.getElementById('final-timer').innerText = `${d2}:${h2.toString().padStart(2,'0')}:${m2.toString().padStart(2,'0')}:${s2.toString().padStart(2,'0')}`;
        }

        // --- ЗАПУСК ИВЕНТА (РАЗЛОМ) ---
        function startEvent() {
            if (eventStarted) return;
            eventStarted = true;

            // 1. Звук
            audioIntro.pause();
            audioEvent.play();

            // 2. Визуал разлома
            shatter.classList.add('cracking');
            document.body.style.animation = "shake 0.1s infinite";

            // 3. Через 10 секунд (длительность raz.mp3 или фрагмента) переходим в будущее
            setTimeout(() => {
                showFuture();
            }, 8000); 
        }

        function showFuture() {
            shatter.classList.remove('cracking');
            shatter.style.display = 'none';
            document.body.style.animation = "none";
            
            audioEvent.pause();
            audioFuture.play();

            // Плавное появление экрана будущего
            futureSection.style.display = 'flex';
            setTimeout(() => {
                futureSection.style.opacity = '1';
                heroSection.style.display = 'none';
                detailsSection.style.display = 'none';
            }, 100);
        }

        setInterval(updateTimers, 1000);

        // --- УПРАВЛЕНИЕ МЫШЬЮ И СКРОЛЛОМ (ОРИГИНАЛЬНОЕ) ---
        window.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
            setTimeout(() => {
                follower.style.left = e.clientX + 'px';
                follower.style.top = e.clientY + 'px';
            }, 50);
        });

        document.addEventListener('mouseover', (e) => {
            if (e.target.classList.contains('hover-target')) cursor.classList.add('hover');
        });
        document.addEventListener('mouseout', (e) => {
            if (e.target.classList.contains('hover-target')) cursor.classList.remove('hover');
        });

        // Включение звука при первом клике (политика браузеров)
        document.addEventListener('click', () => {
            if (!eventStarted) audioIntro.play().catch(()=>{});
        }, {once: true});

        // Громкость
        document.getElementById('volume-slider').addEventListener('input', (e) => {
            const v = e.target.value;
            audioIntro.volume = v; audioEvent.volume = v; audioFuture.volume = v;
        });

        // Скролл (оригинальная логика)
        let currentSection = 0;
        function performScroll(direction) {
            if (eventStarted) return; // Блокируем скролл во время ивента
            if (direction === 'down' && currentSection === 0) {
                heroSection.style.transform = 'translateZ(-500px) rotateX(15deg) translateY(-10%)';
                heroSection.style.opacity = '0';
                detailsSection.style.transform = 'translateY(0) scale(1)';
                currentSection = 1;
            } else if (direction === 'up' && currentSection === 1) {
                heroSection.style.transform = 'translateZ(0) rotateX(0) translateY(0)';
                heroSection.style.opacity = '1';
                detailsSection.style.transform = 'translateY(100%) scale(1.1)';
                currentSection = 0;
            }
        }
        window.addEventListener('wheel', (e) => { e.deltaY > 0 ? performScroll('down') : performScroll('up'); });
    </script>
</body>
</html>
